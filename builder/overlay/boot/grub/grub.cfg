# GRUB A/B boot configuration for RAUC.
#
# /boot (and the kernel) is shared; A/B applies to the root filesystem. GRUB's
# prefix lives on the BOOT partition, so /vmlinuz and /initrd.img below refer to
# files on BOOT. The root= parameter selects which root slot to boot. Persistent
# slot state lives in grubenv (written by RAUC via grub-editenv).

set timeout=3
set default=0

if [ -s ${prefix}/grubenv ]; then
    load_env
fi

if [ "${ORDER}" = "" ]; then set ORDER="A B"; fi
if [ "${A_TRY}" = "" ]; then set A_TRY="0"; fi
if [ "${B_TRY}" = "" ]; then set B_TRY="0"; fi
# _OK is RAUC's variable for "this slot is usable". Default to 1 so an image
# built before these existed still boots; RAUC clears it to disable a slot.
if [ "${A_OK}" = "" ]; then set A_OK="1"; fi
if [ "${B_OK}" = "" ]; then set B_OK="1"; fi

# Pick the first slot in ORDER that is marked OK and whose TRY counter is still
# 0. Both conditions matter: TRY is the one-shot fallback after a boot that
# never completed, and OK is the durable "do not boot this" that RAUC sets.
for SLOT in ${ORDER}; do
    if [ "${SLOT}" = "A" -a "${A_TRY}" = "0" -a "${A_OK}" = "1" ]; then
        set default=0
        set A_TRY="1"
        break
    fi
    if [ "${SLOT}" = "B" -a "${B_TRY}" = "0" -a "${B_OK}" = "1" ]; then
        set default=1
        set B_TRY="1"
        break
    fi
done
save_env A_TRY B_TRY

# rw (not ro): fstab cannot carry a "/" entry because the root device differs
# per A/B slot, so nothing would ever remount the root read-write — leaving
# /var and /etc read-only (breaks systemd-logind's StateDirectory, the
# first-boot-expand stamp, and LUKS enrollment). The initramfs still fscks the
# root before mounting it.
set CMDLINE="rw quiet console=tty0 console=ttyS0,115200 systemd.show_status=1"

menuentry "__OS__ A/B - Slot A (rootfs.0)" {
    linux /vmlinuz-__KVER__ root=LABEL=rootfs-a rauc.slot=A ${CMDLINE}
    initrd /initrd.img-__KVER__
}

menuentry "__OS__ A/B - Slot B (rootfs.1)" {
    linux /vmlinuz-__KVER__ root=LABEL=rootfs-b rauc.slot=B ${CMDLINE}
    initrd /initrd.img-__KVER__
}

# --- recovery ----------------------------------------------------------------
#
# Everything written since imaging lives in the overlay's upper layer, and it is
# shared by both slots so that an A/B update does not destroy /home. The cost is
# that a bad change there follows you into the other slot, so booting the other
# slot is not by itself a way out. These entries are that way out.
#
# They MUST stay below the two entries above: the try-counter logic at the top
# sets default=0 or default=1, so anything appended here is never selected
# automatically. Reaching one takes a person choosing it at the menu.
#
#   reset  sets the upper layer aside as /var/lib/overlay/upper.prev (a rename --
#          nothing is deleted) and boots with an empty one. One boot only.
#   off    ignores the overlay entirely and boots the root slot exactly as the
#          imager wrote it. Use it to tell whether a problem is in the image or
#          in the overlay, and to get in and repair things by hand.
#
# `ab-overlay-diff` inside the running system lists what the upper layer is
# shadowing, which is usually how you decide which of these you need.

menuentry "Recovery: Slot A, reset overlay (keeps a copy)" {
    linux /vmlinuz-__KVER__ root=LABEL=rootfs-a rauc.slot=A ab.overlay=reset ${CMDLINE}
    initrd /initrd.img-__KVER__
}

menuentry "Recovery: Slot B, reset overlay (keeps a copy)" {
    linux /vmlinuz-__KVER__ root=LABEL=rootfs-b rauc.slot=B ab.overlay=reset ${CMDLINE}
    initrd /initrd.img-__KVER__
}

menuentry "Recovery: Slot A, no overlay (image as written)" {
    linux /vmlinuz-__KVER__ root=LABEL=rootfs-a rauc.slot=A ab.overlay=off ${CMDLINE}
    initrd /initrd.img-__KVER__
}

menuentry "Recovery: Slot B, no overlay (image as written)" {
    linux /vmlinuz-__KVER__ root=LABEL=rootfs-b rauc.slot=B ab.overlay=off ${CMDLINE}
    initrd /initrd.img-__KVER__
}
